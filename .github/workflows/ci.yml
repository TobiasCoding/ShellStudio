name: Verify and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y tmux python3-venv
      - run: make check
      - run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: shellstudio-linux
          path: dist/
          if-no-files-found: error
